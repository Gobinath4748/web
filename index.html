<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #5dade2, #2e86c1);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    h2 {
      margin-bottom: 15px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .search-box input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .search-box button {
      background-color: #1abc9c;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .search-box button:hover {
      background-color: #16a085;
    }

    .weather-box img {
      width: 100px;
      margin: 10px 0;
    }

    .weather-box p {
      margin: 5px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌦️ Weather App</h2>
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <div class="weather-box" id="weatherBox">
      <img id="weatherIcon" src="" alt="Weather Icon">
      <h3 id="cityName"></h3>
      <p id="temperature"></p>
      <p id="description"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
    </div>
  </div>

  <script>
    // 🔑 Replace this with your OpenWeatherMap API key
    const apiKey = "3144f55cd0f6b3ef86e5ba633b3b9dad";  

    document.getElementById("searchBtn").addEventListener("click", () => {
      const city = document.getElementById("cityInput").value.trim();
      if (city === "") {
        alert("Please enter a city name");
        return;
      }
      getWeather(city);
    });

    async function getWeather(city) {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("City not found");

        const data = await response.json();
        displayWeather(data);
      } catch (error) {
        alert(error.message);
      }
    }

    function displayWeather(data) {
      document.getElementById("cityName").innerText = `${data.name}, ${data.sys.country}`;
      document.getElementById("temperature").innerText = `🌡️ Temp: ${data.main.temp}°C`;
      document.getElementById("description").innerText = `☁️ ${data.weather[0].description}`;
      document.getElementById("humidity").innerText = `💧 Humidity: ${data.main.humidity}%`;
      document.getElementById("wind").innerText = `🌬️ Wind: ${data.wind.speed} m/s`;

      const iconCode = data.weather[0].icon;
      document.getElementById("weatherIcon").src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }
  </script>
</body>
</html>
